<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ffd6e7,#fff0f5);
    font-family:Arial,sans-serif;
}

.card{
    background:white;
    padding:40px;
    border-radius:30px;
    text-align:center;
    box-shadow:0 0 30px rgba(0,0,0,.1);
    z-index:10;
    max-width:600px;
}

h1{
    color:#ff4d88;
    margin-bottom:20px;
}

p{
    margin:15px 0;
    font-size:20px;
}

#yesBtn{
    padding:18px 35px;
    border:none;
    border-radius:20px;
    background:#ff4d88;
    color:white;
    font-size:22px;
    cursor:pointer;
    transition:.3s;
}

#noBtn{
    margin-top:15px;
    padding:15px 25px;
    border-radius:20px;
    border:2px solid #ff4d88;
    background:white;
    color:#ff4d88;
    font-size:18px;
    cursor:pointer;
}

.heart{
    position:absolute;
    animation:float linear infinite;
}

@keyframes float{
    from{
        transform:translateY(110vh);
        opacity:1;
    }
    to{
        transform:translateY(-150px);
        opacity:0;
    }
}

.bear{
    position:fixed;
    bottom:20px;
    font-size:90px;
    animation:bounce 2s infinite;
}

.left{ left:20px; }
.right{ right:20px; }

@keyframes bounce{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-15px); }
}
</style>
</head>

<body>

<div class="bear left">🧸</div>
<div class="bear right">🧸</div>

<div class="card">
    <h1>AşkımBalımCicim ❤️</h1>

    <p>Böyle bir olayı büyüttüğüm için özür dilerim.</p>

    <p style="color:#ff4d88;font-weight:bold;">
        ozurdilerimkaricigimbarisalimmi
    </p>

    <button id="yesBtn" onclick="showLove()">
        barisalimsenisebiyom ❤️
    </button>

    <br>

    <button id="noBtn" onclick="growButton()">
        yokbensenisebmiyom😡
    </button>
</div>

<script>
// başlangıç kalp yağmuru
for(let i=0;i<50;i++){
    let heart=document.createElement("div");

    heart.className="heart";
    heart.innerHTML="❤️";

    heart.style.left=Math.random()*100+"vw";
    heart.style.fontSize=(20+Math.random()*40)+"px";
    heart.style.animationDuration=(4+Math.random()*6)+"s";

    document.body.appendChild(heart);
}

let count=0;
let scale=1;

// no buton büyüme sistemi
function growButton(){
    count++;
    scale+=0.35;

    document.getElementById("yesBtn").style.transform=
    `scale(${scale})`;

    if(count>=3){
        document.getElementById("noBtn").remove();
    }
}

// artık ortada 3 kalp yok -> sadece ekstra yağmur
function showLove(){
    for(let i=0;i<30;i++){
        let heart=document.createElement("div");

        heart.className="heart";
        heart.innerHTML="❤️";

        heart.style.left=Math.random()*100+"vw";
        heart.style.fontSize=(20+Math.random()*50)+"px";
        heart.style.animationDuration=(3+Math.random()*5)+"s";

        document.body.appendChild(heart);
    }
}
</script>

</body>
</html>
